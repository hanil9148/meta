<html lang="ko"><head><meta charset="utf-8">

<title>찍먹메타</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
[hidden] { display: none !important; }
/* 찍먹메타 — cartoon western defense. Chunky outlined type, slate-blue panels with orange ribbon titles, 3D candy buttons.
   Deliberately single-theme (the game's own colours on both hosts). */
:root {
  --ink: #14202f;
  --bgout: #10151d;
  --panel: #3f5d80;
  --panel2: #2c4566;
  --panel3: #1d2e46;
  --panel4: #16243a;
  --cream: #fbe8c4;
  --cream2: #e9cf9d;
  --yel: #ffc83d; --yel2: #d48f0c;
  --grn: #a3d61e; --grn2: #66960a;
  --cya: #55d3ee; --cya2: #2591b4;
  --red: #ea4a3f; --red2: #a3221c;
  --org: #f6a531; --org2: #c9621a;
  --pur: #a35ae8; --pur2: #6a2bb0;
  --gem: #e45ae8;
  --gold: #ffcf3f;
  --fg: #ffffff;
  --muted: #b3c6dd;
  --dim: #6f86a3;
  --ok: #8fe23a;
  --bad: #ff6a5c;
  --fire: #ff6a3d; --water: #3fa9f5; --bolt: #ffe14a; --earth: #c08d4e; --wind: #6fe0b0;
  --display: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; box-sizing: border-box; background: var(--bgout); color: var(--fg); font-family: var(--body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; justify-content: center; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input { -webkit-user-select: text; user-select: text; }
.ol { text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 3px 0 var(--ink); }
.ol-s { text-shadow: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink), 0 2px 0 var(--ink); }

#app {
  position: relative; width: 100%; max-width: 440px; height: 100%; display: flex; flex-direction: column;
  border: 3px solid var(--ink); border-radius: 26px; overflow: hidden;
  background: linear-gradient(180deg, #5b2416 0%, #9c3d1f 22%, #d0652c 52%, #e58b3c 70%, #8c3c1b 86%, #4a1f10 100%);
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

/* ---------- top bar ---------- */
.top { flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 4px; position: relative; z-index: 3; }
.ava { position: relative; flex: none; width: 64px; display: grid; justify-items: center; gap: 2px; }
.ava .face { width: 58px; height: 58px; border: 3px solid var(--ink); border-radius: 12px; background: var(--panel3); overflow: hidden; display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.ava .face svg { width: 54px; height: 54px; }
.ava .lvb { position: absolute; left: -8px; top: 38px; width: 30px; height: 30px; }
.ava .xpb { width: 52px; height: 8px; margin-left: 10px; border: 2px solid var(--ink); border-radius: 6px; background: var(--panel4); overflow: hidden; }
.ava .xpb i { display: block; height: 100%; background: var(--yel); width: 0; }
.ava .nm { font-family: var(--display); font-size: 10px; color: var(--cream); max-width: 70px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pills { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 6px; padding-top: 6px; }
.pill { position: relative; height: 28px; border: 3px solid var(--ink); border-radius: 9px; background: rgba(20,32,47,.85); display: flex; align-items: center; justify-content: flex-end; padding: 0 5px 0 14px; min-width: 0; }
.pill b { font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: -.2px; color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; }
.pill .pi { position: absolute; left: -9px; top: 50%; transform: translateY(-50%); width: 25px; height: 25px; }
.pill .plus { position: absolute; right: -9px; top: -9px; width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 50%; background: var(--cya); font-family: var(--display); font-size: 15px; line-height: 16px; color: #fff; }
.sqb { flex: none; width: 40px; height: 40px; margin-top: 4px; border: 3px solid var(--ink); border-radius: 11px; background: var(--panel2); display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); position: relative; }
.sqb svg { width: 24px; height: 24px; }
.bang { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 50%; background: var(--red); color: #fff; font-family: var(--display); font-size: 12px; line-height: 14px; text-align: center; z-index: 2; }

/* ---------- main screen ---------- */
#screen { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 6px 12px 14px; display: flex; flex-direction: column; gap: 10px; }

/* home */
.home { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4px 12px 12px; gap: 8px; }
.home-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sides { display: flex; gap: 6px; flex: none; }
.side.sm { width: 58px; }
.side.sm .ic { width: 48px; height: 48px; }
.side.sm .ic svg { width: 32px; height: 32px; }
.side.sm span { font-size: 11px; white-space: nowrap; }
.side { width: 70px; flex: none; display: grid; justify-items: center; gap: 2px; position: relative; }
.side .ic { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); background: var(--panel2); display: grid; place-items: center; box-shadow: inset 0 -5px 0 rgba(0,0,0,.3); }
.side .ic svg { width: 40px; height: 40px; }
.side span { font-family: var(--display); font-size: 12px; color: #fff; }
.modes { display: flex; gap: 6px; margin-top: 0; padding: 5px; background: rgba(20,32,47,.6); border: 3px solid var(--ink); border-radius: 14px; }
.modes button { min-width: 64px; padding: 8px 10px; border: 3px solid var(--ink); border-radius: 10px; font-family: var(--display); font-size: 15px; background: var(--cya); box-shadow: inset 0 -4px 0 var(--cya2); }
.modes button.elite { background: var(--pur); box-shadow: inset 0 -4px 0 var(--pur2); }
.modes button.off { background: var(--panel4); box-shadow: none; color: var(--dim); position: relative; }
.stage-title { display: flex; align-items: center; justify-content: center; gap: 8px; }
.stage-title b { font-family: var(--display); font-weight: 400; font-size: 19px; white-space: nowrap; }
.stage-title > div { min-width: 0; text-align: center; }
.stage-title small { display: block; font-family: var(--display); font-size: 13px; color: var(--cream); text-align: center; }
.arrow { width: 34px; height: 34px; border: 3px solid var(--ink); border-radius: 10px; background: var(--panel2); font-family: var(--display); font-size: 16px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); }
.arrow:disabled { opacity: .35; }
.qbtn { width: 26px; height: 26px; border: 3px solid var(--ink); border-radius: 50%; background: var(--panel2); font-family: var(--display); font-size: 14px; }
.scene { flex: 1; min-height: 0; position: relative; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: #c8612e; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .plays { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border: 3px solid var(--ink); border-radius: 10px; background: rgba(20,32,47,.82); font-family: var(--display); font-size: 13px; }
.scene .pw { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border: 3px solid var(--ink); border-radius: 10px; background: var(--red); font-family: var(--display); font-size: 15px; }
.scene .pw svg { width: 22px; height: 22px; }
.scene .bossflag { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 4px 12px; border: 3px solid var(--ink); border-radius: 10px; background: var(--red); font-family: var(--display); font-size: 13px; white-space: nowrap; }
.start-row { display: grid; grid-template-columns: 70px 1fr 70px; align-items: end; gap: 10px; }
.start { position: relative; height: 66px; border: 3px solid var(--ink); border-radius: 16px; background: var(--yel); box-shadow: inset 0 -7px 0 var(--yel2), 0 4px 0 var(--ink); font-family: var(--display); font-size: 30px; letter-spacing: .04em; }
.start:active { transform: translateY(3px); box-shadow: inset 0 -4px 0 var(--yel2), 0 1px 0 var(--ink); }
.start .cost { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; font-size: 16px; }
.start .cost svg { width: 22px; height: 22px; }

/* nav */
.nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 8px 10px; background: var(--panel4); border-top: 3px solid var(--ink); position: relative; z-index: 3; }
.nav button { position: relative; height: 62px; border: 3px solid var(--ink); border-radius: 12px; background: var(--panel3); display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
.nav button svg { width: 40px; height: 40px; }
.nav button span { display: none; font-family: var(--display); font-size: 14px; margin-top: -6px; }
.nav button.on { background: linear-gradient(#3ea3e6, #1f6fbf); height: 74px; margin-top: -12px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); }
.nav button.on span { display: block; }
.nav button.on svg { width: 36px; height: 36px; }
.nav button .bang { right: 2px; top: 2px; }

/* ---------- generic panel bits ---------- */
.card { border: 3px solid var(--ink); border-radius: 16px; background: var(--panel); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card.dark { background: var(--panel3); }
.card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; }
.desc { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.desc b { color: #fff; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 42px; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 12px; font-family: var(--display); font-size: 16px; color: #fff; background: var(--cya); box-shadow: inset 0 -5px 0 var(--cya2), 0 3px 0 var(--ink); white-space: nowrap; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -3px 0 var(--cya2), 0 1px 0 var(--ink); }
.btn.y { background: var(--yel); box-shadow: inset 0 -5px 0 var(--yel2), 0 3px 0 var(--ink); }
.btn.g { background: var(--grn); box-shadow: inset 0 -5px 0 var(--grn2), 0 3px 0 var(--ink); }
.btn.r { background: var(--red); box-shadow: inset 0 -5px 0 var(--red2), 0 3px 0 var(--ink); }
.btn.p { background: var(--pur); box-shadow: inset 0 -5px 0 var(--pur2), 0 3px 0 var(--ink); }
.btn.o { background: var(--org); box-shadow: inset 0 -5px 0 var(--org2), 0 3px 0 var(--ink); }
.btn:disabled, .btn.off { background: #4a5a6e; box-shadow: inset 0 -5px 0 #34404f, 0 3px 0 var(--ink); color: #b8c2cf; cursor: default; transform: none; }
.btn svg { width: 20px; height: 20px; }
.btn.sm { min-height: 34px; font-size: 14px; padding: 4px 10px; border-radius: 10px; }
.btn.wide { width: 100%; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 8px 6px; border: 3px solid var(--ink); border-radius: 10px; background: var(--panel3); font-family: var(--display); font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--yel); color: #fff; box-shadow: inset 0 -4px 0 var(--yel2); }
.bar { position: relative; height: 18px; border: 3px solid var(--ink); border-radius: 10px; background: var(--panel4); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--yel); }
.bar b { position: relative; display: block; text-align: center; font-family: var(--display); font-weight: 400; font-size: 11px; line-height: 12px; }
.bar.red i { background: linear-gradient(#ff6a5c, #c42a22); }
.bar.cy i { background: linear-gradient(#6fe3ff, #2a9fd0); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border: 2px solid var(--ink); border-radius: 8px; font-size: 11px; font-weight: 700; color: var(--ink); }
.e0 { background: var(--fire); } .e1 { background: var(--water); } .e2 { background: var(--bolt); } .e3 { background: var(--earth); } .e4 { background: var(--wind); }
.stars { color: var(--yel); font-size: 12px; letter-spacing: -1px; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kv > div { border: 3px solid var(--ink); border-radius: 12px; background: var(--panel3); padding: 6px; text-align: center; }
.kv span { display: block; font-size: 11px; color: var(--muted); }
.kv b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.kv .ok b { color: var(--ok); } .kv .mid b { color: #fff; } .kv .bad b { color: var(--bad); }
.msg { text-align: center; font-family: var(--display); font-size: 15px; min-height: 22px; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); } .msg.mute { color: var(--muted); }

/* hero (gunslinger) tiles */
.slots4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.htile { position: relative; border: 3px solid var(--ink); border-radius: 12px; background: var(--panel3); padding: 4px 2px 6px; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.htile svg.face { width: 54px; height: 54px; }
.htile .hn { font-family: var(--display); font-size: 13px; }
.htile .st { font-size: 10px; color: var(--yel); font-weight: 900; }
.htile.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--ink), 0 0 12px rgba(255,255,255,.6); }
.htile.rmsel { border-color: var(--red); box-shadow: 0 0 0 2px var(--ink), 0 0 12px rgba(234,74,63,.8); }
.htile.rmsel::after { content: '✓'; position: absolute; right: 4px; top: 2px; width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 50%; background: var(--red); color: #fff; font: 900 12px/16px var(--body); text-align: center; }
.rmsel3 { display: grid; grid-template-columns: 1fr 1fr .7fr; gap: 6px; }
.rmsel3 .btn { min-width: 0; white-space: normal; line-height: 1.15; padding: 6px 4px; font-size: 13px; }
.rmbar > * { min-width: 0; }
.rmbar { min-width: 0; display: grid; gap: 8px; padding: 8px; border: 3px solid var(--red); border-radius: 12px; background: rgba(234,74,63,.12); }
.htile.r2 { background: linear-gradient(#3b6fb3, #1d3a66); }
.htile.r3 { background: linear-gradient(#8a4fd0, #43207a); }
.htile.r4 { background: linear-gradient(#e2a02a, #8a4a10); }
.htile.gr0 { background: linear-gradient(#5d6878, #343c48); }
.htile.gr1 { background: linear-gradient(#3f8f4c, #1e4d27); }
.htile.gr2 { background: linear-gradient(#3b6fb3, #1d3a66); }
.htile.gr3 { background: linear-gradient(#8a4fd0, #43207a); }
.htile.gr4 { background: linear-gradient(#e2a02a, #8a4a10); }
.htile.emp { color: var(--dim); font-family: var(--display); font-size: 12px; place-content: center; min-height: 92px; }
.hgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* skills */
.robo { position: relative; border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(#2d6fd0, #1a4ea8); padding: 14px 12px 12px; display: grid; justify-items: center; gap: 10px; overflow: hidden; }
.robo::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; }
.robo svg { position: relative; width: 120px; height: 100px; }
.robo .bonus { position: relative; width: 100%; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 12px; background: var(--pur); text-align: center; padding: 6px; }
.robo .bonus small { display: block; font-family: var(--display); font-size: 13px; color: #ffd0b0; }
.robo .bonus b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; }
.robo .bonus span { font-size: 11px; color: #f0e2ff; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sk { position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 6px; align-items: center; border: 3px solid var(--ink); border-radius: 14px; background: linear-gradient(#3aa0e8, #2076c4); padding: 5px; text-align: left; min-width: 0; }
.sk .si { width: 54px; height: 54px; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; }
.sk .si svg { width: 100%; height: 100%; display: block; }
.sk b { font-family: var(--display); font-weight: 400; font-size: 14px; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sk .lvbox { background: var(--cream); border-radius: 8px; padding: 2px 5px 4px; display: grid; gap: 2px; }
.sk .lvbox span { font-family: var(--display); font-size: 12px; color: #b0631a; }
.sk .lvbox .bar { height: 15px; }
.sk .lvbox .bar b { font-size: 10px; line-height: 9px; }
.sk.lock { background: var(--panel3); }
.sk.lock .si { filter: grayscale(1) brightness(.5); }
.sk.lock .lvbox { background: #3b3330; }
.sk.lock .lvbox span { color: var(--cream2); font-size: 11px; text-align: center; }
.sk .lk { position: absolute; right: -6px; top: -8px; width: 26px; height: 30px; }
.sk .bang { right: -6px; top: -8px; }

/* shop */
.shopi { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; border: 3px solid var(--ink); border-radius: 14px; background: var(--panel3); padding: 8px; }
.shopi .ico { width: 58px; height: 58px; border: 3px solid var(--ink); border-radius: 12px; display: grid; place-items: center; background: var(--panel2); }
.shopi .ico svg { width: 44px; height: 44px; }
.shopi b { font-family: var(--display); font-weight: 400; font-size: 16px; display: block; }
.shopi p { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
.shopi .buy { display: grid; justify-items: end; gap: 4px; }
.shopi .price { font-family: var(--display); font-size: 15px; color: var(--yel); display: flex; align-items: center; gap: 2px; }
.shopi .price svg { width: 18px; height: 18px; }
.shopi .left { font-size: 11px; color: var(--muted); }
.pullres { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pullres .htile svg.face { width: 44px; height: 44px; }
.pullres .tag { font-size: 9px; font-weight: 900; color: var(--ok); }
.pullres .tag.dup { color: var(--muted); }

/* boss */
.boss { border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(#3b1d5c, #1c0f30); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 40px rgba(163,90,232,.35); }
.boss .bh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.boss .bh b { font-family: var(--display); font-weight: 400; font-size: 24px; color: #f1e4ff; }
.boss .tagw { padding: 2px 10px; border: 2px solid #b48cff; border-radius: 999px; color: #d9c4ff; font-size: 12px; font-weight: 900; white-space: nowrap; }
.boss .hpbar { position: relative; height: 26px; border: 3px solid #7a1d2a; border-radius: 10px; background: #2a0a10; overflow: hidden; }
.boss .hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ff5468, #a01428); }
.boss .hpbar b { position: relative; display: block; text-align: center; font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 20px; }
.boss .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #cdb9ef; }
.boss .art { position: relative; height: 190px; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 55%, #6a32a8, #1a0d2e 70%); }
.boss .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.boss .note { font-size: 14px; font-weight: 700; color: #fff; }
.boss .note small { display: block; color: #b48cff; font-weight: 500; font-size: 12px; }
.pickrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pickrow .htile { background: #2a1846; }

  /* active skills */
  const SKCD = { venom: 2.4, solar: 4.5, web: 6, cannon: 3.2, frost: 5, plasma: 2.8, cloud: 6.5, shuri: 1.9, grav: 7.5 };

  function updFx(dt) {

  /* ---------- level up picks ---------- */

  /* stages 1~39 (normal mode): after 3 s a skip button finishes the stage at once with normal clear rewards.

  const SKIP_N = 39, SKIP_WAIT = 3;

      (drops.length ? '<p class="desc" style="text-align:center;color:var(--yel)"><b>장비 획득!</b></p><div class="rewards">' + drops.map(d => '<div class="rw">' + itemIcon(d.id) + '<b class="ol-s" style="font-size:12px">' + iK(d.id).nm + '</b><span style="color:' + RAR[iG(d.id)].c + '">' + (d.isNew ? 'NEW · ' : '+1 · ') + RAR[iG(d.id)].nm + '</span></div>').join('') + '</div>' : '') +
