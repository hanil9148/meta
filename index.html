<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d110e">
<title>찍먹메타</title>
<script>window.jmReady = window.jmReady || new Promise(function (r) { window.__jmResolve = r; });</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one-screen side-view field game. Header and HUD on top, the battlefield canvas fills the rest (enemies walk left to right, the bunker holds the right edge). Menus are a full-screen overlay. Deliberately single-theme (dark field). */
:root {
  --bg: #0d110e;
  --ground: #131a14;
  --panel: #1a221b;
  --line: #2a342b;
  --fg: #dde5d6;
  --muted: #8b9a88;
  --accent: #e3a93b;
  --accent-ink: #1a1405;
  --danger: #d9604b;
  --ok: #86b36a;
  --sand: #7d6f48;
  --bunker: #2b352c;
  --steel: #8da2b4;
  --steel-dark: #36424d;
  --concrete: #707c72;
  --gold: #f2cd6b;
  --fire: #ff7a45;
  --water: #4aa8e0;
  --bolt: #ffe94d;
  --earth: #a98a55;
  --wind: #7ed6b0;
  --e1: #c4584a;
  --e2: #d58b3c;
  --e3: #8a64a8;
  --display: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
header, .gh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .02em; margin: 0; color: var(--accent); white-space: nowrap; }
.wave { color: var(--muted); font-size: 13px; text-align: right; min-width: 0; }
.wave #hStage { color: var(--fg); font-weight: 700; }
.wave b { color: var(--fg); font-family: var(--display); font-weight: 400; font-size: 18px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.hud { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: end; }
.hud > div { min-width: 0; }
.lab { display: block; font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
.hud b { font-family: var(--display); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; }
.hpline { display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .15s linear, background .2s; }
#hpTxt { font-size: 14px; min-width: 2.6em; text-align: right; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#box { position: relative; border: 1px solid var(--line); background: var(--ground); }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#ov {
  position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: rgba(10, 14, 11, .94); box-sizing: border-box; padding: 12px;
}
.card { width: 100%; max-width: 320px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.card p b { color: var(--fg); font-weight: 700; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stats div b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.ups { display: grid; gap: 8px; }
.list { position: relative; display: grid; gap: 8px; overflow-y: auto; min-height: 0; padding-right: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row button { flex: 1; justify-content: center; padding: 10px 4px; }
.pvrow { display: flex; align-items: center; gap: 14px; }
#pv { width: 110px; height: 176px; flex: none; border: 1px solid var(--line); background: var(--ground); }
.msg { min-height: 1.6em; font-weight: 700; }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--danger); }
.msg.mute { color: var(--muted); font-weight: 400; }
.up { display: grid; gap: 8px; border: 1px solid var(--line); padding: 10px; background: var(--panel); }
.uh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.uh b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.uh span { color: var(--accent); font-family: var(--display); font-variant-numeric: tabular-nums; }
.lvbar { height: 6px; background: var(--bg); border: 1px solid var(--line); }
.lvbar i { display: block; height: 100%; background: var(--accent); }
.up p { font-size: 12px; line-height: 1.5; }
.up button { background: var(--bg); }
.odds { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
.dot.e0 { background: var(--fire); }
.dot.e1 { background: var(--water); }
.dot.e2 { background: var(--bolt); }
.dot.e3 { background: var(--earth); }
.dot.e4 { background: var(--wind); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slots button { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding: 8px 10px; min-height: 62px; }
.slots button small { margin-top: 0; color: var(--fg); font-size: 13px; }
.up.r2 { border-color: var(--steel); }
.up.r3 { border-color: var(--accent); }
.up.r4 { border-color: var(--gold); background: var(--steel-dark); }
.pull { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); padding: 8px 10px; }
.pull b { font-family: var(--display); font-weight: 400; font-size: 16px; margin-right: 6px; }
.pull.r2 { border-color: var(--steel); }
.pull.r3 { border-color: var(--accent); }
.pull.r4 { border-color: var(--gold); background: var(--steel-dark); }
.tag { font-family: var(--display); font-size: 13px; color: var(--accent); white-space: nowrap; }
.stars { font-size: 17px; line-height: 1.3; color: var(--gold); letter-spacing: 2px; }
.stars div { white-space: nowrap; }
.tg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tg button { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 10px; }
.tg button small { margin-top: 0; }
button {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  padding: 10px 12px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { border-color: var(--accent); }
button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
button .cost { font-family: var(--display); color: var(--accent); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); justify-content: center; font-family: var(--display); font-size: 20px; padding: 14px; }
button.go:hover:not(:disabled) { filter: brightness(1.08); }
button.ctr { justify-content: center; }
.foot { display: flex; align-items: center; justify-content: center; gap: 12px; }
.hint { color: var(--muted); font-size: 12px; min-width: 0; }
header.app { align-items: center; }
.tabs { display: flex; gap: 6px; }
#tOut { font-size: 12px !important; padding: 8px 10px !important; color: var(--muted); }
#login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.lcard { width: 100%; max-width: 320px; display: grid; gap: 14px; text-align: center; }
.lcard h2 { font-family: var(--display); font-weight: 400; font-size: 36px; margin: 0; color: var(--accent); }
.lcard .note { font-size: 14px; }
.tabs button { padding: 8px 14px; font-family: var(--display); font-size: 15px; justify-content: center; white-space: nowrap; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gname { font-family: var(--display); color: var(--muted); font-size: 15px; }
.view { flex: 1; min-height: 0; }
#vGame { position: relative; display: flex; flex-direction: column; gap: 10px; }
#vRank { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.rk-card { flex: none; border: 1px solid var(--line); background: var(--panel); padding: 12px; display: grid; gap: 8px; }
.nickrow { display: flex; gap: 8px; }
input { -webkit-user-select: text; user-select: text; }
.nickrow input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; }
.nickrow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.go.small { font-size: 16px; padding: 10px 18px; }
.note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.onl { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; font-size: 13px; }
.chip.me { border-color: var(--accent); }
.chip small { display: inline; margin: 0 0 0 6px; color: var(--muted); font-size: 11px; }
.subs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.subs button { justify-content: center; padding: 8px 4px; font-size: 13px; }
.subs button.on { border-color: var(--accent); color: var(--accent); }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.board li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; }
.board li.me { border-color: var(--accent); }
#goPlay { flex: none; width: 100%; font-size: 20px; padding: 14px; justify-content: center; }
.rk-head { flex: none; display: grid; gap: 4px; }
.board li.pc { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 10px; }
.pc-top { display: flex; align-items: center; gap: 8px; }
.pc-top .nm { flex: 1; }
.st { font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
.st.on { color: var(--ok); border-color: var(--ok); }
.pc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kv { display: grid; gap: 1px; min-width: 0; }
.kv .k, .pc-units .k { color: var(--muted); font-size: 11px; }
.kv .v { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.kv:first-child { grid-column: 1 / -1; }
.pc-units { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.uc { border: 1px solid var(--line); background: var(--panel); padding: 2px 8px; font-size: 12px; white-space: nowrap; }
.board li.empty { display: block; color: var(--muted); font-size: 13px; }
.board .pos { font-family: var(--display); color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; }
.board .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.board .val { color: var(--muted); font-size: 12px; text-align: right; }
</style>

</head><body>
<header class="app">
  <h1>찍먹메타</h1>
  <nav class="tabs" aria-label="메뉴">
    <button id="tRank" class="on" type="button" aria-pressed="true">친구 목록</button>
    <button id="tGame" type="button" aria-pressed="false">게임</button>
    <button id="tOut" type="button" hidden>로그아웃</button>
  </nav>
</header>
<div id="login"><div class="lcard">
  <h2>찍먹메타</h2>
  <p id="lMsg" class="note">접속 확인 중…</p>
  <button id="lBtn" class="go" type="button" hidden>Google로 로그인</button>
  <p id="lErr" class="note" hidden></p>
</div></div>
<main id="vGame" class="view" hidden>
<div class="gh">
  <span class="gname">벙커 지키기</span>
  <div class="wave"><span id="hStage">1 쉬움</span> · 웨이브<b id="hWave">1/3</b> · <b id="hTime">0</b>초</div>
</div>
<section class="hud" aria-label="상태">
  <div><span class="lab">벙커 체력</span><div class="hpline"><div class="bar"><i id="hpBar"></i></div><b id="hpTxt">100</b></div></div>
  <div><span class="lab">고철</span><b id="hScrap">0</b></div>
  <div><span class="lab">점수</span><b id="hScore">0</b></div>
</section>
<div class="stage" id="stage">
  <div id="box"><canvas id="cv"></canvas></div>
</div>
<div class="foot">
  <div class="hint" id="hint">포탑과 유닛이 자동으로 공격합니다. 웨이브는 20~30초 이어집니다</div>
</div>
<div id="ov" hidden></div>
</main>
<main id="vRank" class="view">
  <button id="goPlay" class="go" type="button">게임하러 가기</button>
  <section class="rk-card">
    <label class="lab" for="nickIn">내 닉네임</label>
    <form id="nickForm" class="nickrow">
      <input id="nickIn" maxlength="8" placeholder="친구들에게 보일 이름" autocomplete="off">
      <button class="go small" type="submit">저장</button>
    </form>
    <div id="rkStatus" class="note">랭킹을 불러오는 중이에요.</div>
  </section>
  <div class="rk-head"><span class="lab">정렬</span>
    <div id="rkSubs" class="subs">
      <button type="button" data-sub="stage" class="on">진도</button>
      <button type="button" data-sub="bl">벙커</button>
      <button type="button" data-sub="smax">유닛 ★</button>
      <button type="button" data-sub="plays">판수</button>
    </div>
  </div>
  <ol id="rkList" class="board"></ol>
  <section class="rk-card">
    <span class="lab">친구 초대</span>
    <p class="note">이 주소를 친구에게 알려주세요. 구글 계정으로 로그인하면 같은 목록에 올라와요. 게임 진행 상황은 계정에 저장돼서 다른 기기에서도 이어서 할 수 있어요.</p>
  </section>
</main>

<script>
(() => {
  /* Field: enemies walk left to right and hit the wall at WALLX. The bunker sits on the right edge; its origin (BX, BY) is the bunker centre. */
  const W = 480, H = 400, BX = W - 48, BY = H / 2, WALLX = BX - 46, TX = -18, SX = 12, SY = [-75, -25, 25, 75];
  const SPD = 1.7;
  const WAVES = 3, NEED = 30, KEY = 'bunker-save-v2';
  const NAMES = ['쉬움', '말랑', '산책', '평온', '보통', '무난', '도전', '긴장', '까다로움', '어려움',
    '매움', '거침', '험난', '가혹', '악랄', '살벌', '지독', '무자비', '공포', '악몽',
    '절망', '파멸', '아수라', '연옥', '나락', '몰살', '종말', '지옥문', '불지옥', '헬'];
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage'), box = document.getElementById('box'), ov = document.getElementById('ov');
  const cs = getComputedStyle(document.documentElement);
  const C = n => cs.getPropertyValue(n).trim();
  const col = {
    ground: C('--ground'), line: C('--line'), fg: C('--fg'), accent: C('--accent'), danger: C('--danger'),
    sand: C('--sand'), bunker: C('--bunker'), steel: C('--steel'), steelDark: C('--steel-dark'), concrete: C('--concrete'), gold: C('--gold'),
    e1: C('--e1'), e2: C('--e2'), e3: C('--e3'), ok: C('--ok'),
    fire: C('--fire'), water: C('--water'), bolt: C('--bolt'), earth: C('--earth'), wind: C('--wind')
  };
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TYPES = {
    grunt:  { hp: 20, sp: 38, r: 9,  dmg: 6,  sc: 10, scrap: 3,  c: col.e1 },
    runner: { hp: 10, sp: 82, r: 7,  dmg: 4,  sc: 15, scrap: 4,  c: col.e2 },
    tank:   { hp: 90, sp: 24, r: 15, dmg: 18, sc: 40, scrap: 10, c: col.e3 }
  };
  /* Units: a name plus 1 to 4 elements (0 fire, 1 water, 2 lightning, 3 earth, 4 wind). Duplicates merge into stars. */
  const NMS = ['한일', '성민', '금유', '도영', '진명', '해천', '정욱', '재원'];
  const ENM = ['불', '물', '번개', '땅', '바람'];
  const EFF = ['화상', '둔화', '연쇄', '폭발', '넉백·관통'];
  const EC = [col.fire, col.water, col.bolt, col.earth, col.wind];
  const ukey = u => u.n + '|' + u.e.join('');
  function cleanColl(a) {
    const out = [], seen = {};
    if (!Array.isArray(a)) return out;
    for (const u of a) {
      if (!u || !Array.isArray(u.e)) continue;
      const n = (+u.n) | 0;
      const e = Array.from(new Set(u.e.map(x => (+x) | 0))).filter(x => x >= 0 && x < 5).sort((p, q) => p - q);
      if (n < 0 || n >= NMS.length || e.length < 1 || e.length > 4) continue;
      const v = { n, e, s: Math.min(30, Math.max(0, (+u.s) | 0)), dc: Math.min(2, Math.max(0, (+u.dc) | 0)) };
      if (seen[ukey(v)]) continue;
      seen[ukey(v)] = 1; out.push(v);
    }
    return out;
  }
  const getUnit = k => k ? (save.coll.find(u => ukey(u) === k) || null) : null;
  function ustat(u) {
    let dmg = 12, delay = .65, pierce = 1, splash = 0, burn = 0, slow = 0, chain = 0, kb = 0;
    for (const el of u.e) {
      if (el === 0) burn = .4;
      else if (el === 1) slow = .35;
      else if (el === 2) chain = 2;
      else if (el === 3) { dmg *= 1.3; delay *= 1.15; splash = 30; }
      else { delay *= .7; kb = 14; pierce = 2; }
    }
    dmg *= (1 + .25 * (u.e.length - 1)) * (1 + .06 * u.s);
    delay *= 1 - .02 * Math.floor(u.s / 5);
    return { dmg, delay, pierce, splash, burn, slow, chain, kb, sp: 560 };
  }
  const hpBonus = l => l * 5, defRed = l => l * .022;

  /* ---------- save ---------- */
  let save = { plays: Array(30).fill(0), best: Array(30).fill(0), unlocked: 1, gold: 0, hl: 0, dl: 0, coll: [], units: [null, null, null, null] };
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (r && Array.isArray(r.plays) && Array.isArray(r.best) && r.unlocked >= 1) {
      save = {
        plays: Array.from({ length: 30 }, (_, i) => +r.plays[i] || 0),
        best: Array.from({ length: 30 }, (_, i) => +r.best[i] || 0),
        unlocked: Math.min(30, Math.max(1, (+r.unlocked) | 0)),
        gold: Math.max(0, Math.floor(+r.gold || 0)),
        hl: Math.min(30, Math.max(0, (+r.hl) | 0)),
        dl: Math.min(30, Math.max(0, (+r.dl) | 0)),
        coll: cleanColl(r.coll),
        units: [null, null, null, null]
      };
      const seen = {};
      for (let i = 0; i < 4; i++) {
        const k = r.units && r.units[i];
        if (typeof k === 'string' && !seen[k] && save.coll.some(u => ukey(u) === k)) { save.units[i] = k; seen[k] = 1; }
      }
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} scheduleSync(); }
  let cur = save.unlocked;

  let S, mode = 'start', paused = true;

  function params(n) {
    const t = (n - 1) / 29;
    return { hpm: .6 + t * 2.4, spm: .75 + t * .65, cnt: 1 + t * .8, dm: .6 + t * 1.2, scr: 1 + t * .5, hp: Math.round(140 - t * 50), d: n - 1 };
  }
  function reset() {
    const P = params(cur), hp0 = P.hp + hpBonus(save.hl);
    S = { P, wave: 0, L: 1, score: 0, scrap: 0, hp: hp0, maxHp: hp0, dr: 1 - defRed(save.dl), dmg: 10, delay: .45, lvF: 0, lvD: 0, lvA: 0,
      kills: 0, cd: 0, wt: 0, dur: 0, ang: Math.PI, bul: [], en: [], par: [], toSpawn: 0, spawnT: 0, shake: 0, flash: 0,
      units: save.units.map((k, i) => { const u = getUnit(k); return u ? { nm: NMS[u.n], e: u.e, st: ustat(u), cd: .2 + i * .12, ang: Math.PI } : null; }), fx: [] };
  }

  /* ---------- sizing ---------- */
  function fit() {
    const r = stage.getBoundingClientRect();
    const k = Math.max(0.1, Math.min(r.width / W, r.height / H));
    box.style.width = Math.floor(W * k) + 'px';
    box.style.height = Math.floor(H * k) + 'px';
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);

  /* ---------- waves ---------- */
  function startWave() {
    S.wave++;
    S.L = S.wave + S.P.d * .4;
    S.toSpawn = Math.round((6 + S.L * 4.5) * S.P.cnt);
    S.total = S.toSpawn;
    S.dur = 20 + Math.random() * 10;
    S.span = Math.max(10, S.dur - 8);
    S.wt = 0;
    S.spawnT = .8;
    mode = 'play';
    ov.hidden = true;
  }
  function startRun() { reset(); startWave(); }
  function spawn() {
    const L = S.L, P = S.P;
    let kind = 'grunt';
    if (L >= 2 && Math.random() < Math.min(.35, .1 + L * .04)) kind = 'runner';
    if (L >= 3 && Math.random() < Math.min(.25, .05 + L * .03)) kind = 'tank';
    const T = TYPES[kind];
    const hp = T.hp * P.hpm * (1 + L * .06);
    S.en.push({ x: -20, y: BY - 112 + Math.random() * 224, k: kind, hp, mh: hp, sp: T.sp * P.spm * (1 + L * .015) * SPD, r: T.r, dmg: T.dmg * P.dm, fl: 0 });
  }
  function burst(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = 30 + Math.random() * 90;
      S.par.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: .35 + Math.random() * .25, c });
    }
  }
  function hurt(e, a, quiet) {
    if (e.hp <= 0) return;
    e.hp -= a; if (!quiet) e.fl = .08;
    if (e.hp <= 0) {
      const T = TYPES[e.k];
      S.score += T.sc; S.scrap += Math.max(1, Math.round(T.scrap * S.P.scr)); S.kills++;
      burst(e.x, e.y, T.c, 10);
    }
  }
  /* Enemy closest to the wall, aimed with a lead because enemies walk right at a fixed speed. */
  function pick(x, y, spd) {
    let best = null;
    for (const e of S.en) {
      if (e.hp <= 0 || e.x < -4 || e.x >= WALLX) continue;
      if (!best || e.x > best.x) best = e;
    }
    if (!best) return null;
    const d = Math.hypot(best.x - x, best.y - y), t = Math.max(0, (d - 14) / spd);
    const px = best.x + best.sp * t, py = best.y;
    return { x: px, y: py, a: Math.atan2(py - y, px - x) };
  }
  function mk(x, y, ca, sa, o) {
    return { x, y, vx: ca * o.sp, vy: sa * o.sp, dmg: o.dmg, pierce: o.pierce, splash: o.splash, c: o.c || col.accent, burn: o.burn || 0, slow: o.slow || 0, chain: o.chain || 0, kb: o.kb || 0, hits: [] };
  }

  /* ---------- update ---------- */
  function update(dt) {
    const tx = BX + TX, ty = BY;
    S.wt += dt;
    const tg = pick(tx, ty, 540);
    S.ang = tg ? tg.a : Math.PI;
    S.cd -= dt;
    if (tg && S.cd <= 0) {
      const ca = Math.cos(S.ang), sa = Math.sin(S.ang);
      S.bul.push(mk(tx + ca * 34, ty + sa * 34, ca, sa, { dmg: S.dmg, sp: 540, pierce: 1, splash: 0 }));
      S.cd = S.delay;
    }
    const dm = S.dmg / 10, rm = S.delay / .45;
    for (let i = 0; i < 4; i++) {
      const u = S.units[i]; if (!u) continue;
      const s = u.st, ux = BX + SX, uy = BY + SY[i];
      u.cd -= dt;
      const t = pick(ux, uy, s.sp);
      u.ang = t ? t.a : Math.PI;
      if (t && u.cd <= 0) {
        const ca = Math.cos(t.a), sa = Math.sin(t.a);
        S.bul.push(mk(ux + ca * 14, uy + sa * 14, ca, sa, { dmg: s.dmg * dm, sp: s.sp, pierce: s.pierce, splash: s.splash, c: EC[u.e[0]], burn: s.burn, slow: s.slow, chain: s.chain, kb: s.kb }));
        u.cd = s.delay * rm;
      }
    }
    for (const b of S.bul) { b.x += b.vx * dt; b.y += b.vy * dt; }
    S.bul = S.bul.filter(b => b.x > -10 && b.x < W + 10 && b.y > -10 && b.y < H + 10);

    if (S.toSpawn > 0) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) { spawn(); S.toSpawn--; S.spawnT = (S.span / S.total) * (.6 + Math.random() * .8); }
    }

    for (const e of S.en) {
      let spd = e.sp;
      if (e.st > 0) { e.st -= dt; spd *= 1 - e.sf; }
      if (e.bt > 0) { e.bt -= dt; hurt(e, e.bd * dt, true); }
      e.x += spd * dt;
      if (e.fl > 0) e.fl -= dt;
      if (e.hp > 0 && e.x + e.r >= WALLX) {
        S.hp -= e.dmg * S.dr; e.hp = 0;
        S.shake = .5; S.flash = .5;
        burst(e.x, e.y, col.danger, 8);
      }
    }
    for (const b of S.bul) {
      for (const e of S.en) {
        if (b.dead) break;
        if (e.hp <= 0 || b.hits.includes(e)) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
          b.hits.push(e);
          hurt(e, b.dmg);
          if (e.hp > 0) {
            if (b.burn) { e.bt = 3; e.bd = Math.max(e.bd || 0, b.dmg * b.burn); }
            if (b.slow) { e.st = 2; e.sf = Math.max(e.sf || 0, b.slow); }
            if (b.kb) e.x = Math.max(-10, e.x - b.kb);
          }
          if (b.chain) {
            const near = S.en.filter(o => o !== e && o.hp > 0 && !b.hits.includes(o) && Math.hypot(o.x - e.x, o.y - e.y) < 90)
              .sort((p, q) => Math.hypot(p.x - e.x, p.y - e.y) - Math.hypot(q.x - e.x, q.y - e.y)).slice(0, b.chain);
            for (const o of near) { hurt(o, b.dmg * .6); S.fx.push({ x1: e.x, y1: e.y, x2: o.x, y2: o.y, l: .15 }); }
          }
          if (b.splash) {
            for (const o of S.en) if (o !== e && o.hp > 0 && Math.hypot(o.x - e.x, o.y - e.y) < b.splash) hurt(o, b.dmg * .6);
            burst(e.x, e.y, col.gold, 6);
          }
          if (--b.pierce <= 0) b.dead = true;
          if (e.hp > 0) burst(b.x, b.y, col.fg, 2);
        }
      }
    }
    S.bul = S.bul.filter(b => !b.dead);
    S.en = S.en.filter(e => e.hp > 0);
    for (const p of S.par) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; }
    S.par = S.par.filter(p => p.l > 0);
    for (const f of S.fx) f.l -= dt;
    S.fx = S.fx.filter(f => f.l > 0);
    S.shake = Math.max(0, S.shake - dt * 2.5);
    S.flash = Math.max(0, S.flash - dt * 2);

    if (S.hp <= 0) { S.hp = 0; finish(false); }
    else if (S.toSpawn === 0 && S.en.length === 0 && S.wt >= S.dur) {
      S.score += S.wave * 50;
      if (S.wave >= WAVES) finish(true); else waveClear();
    }
  }

  /* ---------- bunker look ---------- */
  const BODY_N = ['콘크리트 상자', '보강 상자', '리벳 장갑', '각진 요새', '쌍포 요새', '황금 요새'];
  const WALL_N = ['모래주머니', '콘크리트 블록', '콘크리트 벽', '강철 분절벽', '가시 강철벽', '에너지 장벽'];
  /* Drawn around the bunker centre (0,0). Body tier follows the health level, wall tier follows the defense level. */
  function drawBunker(c, hl, dl, low, units, ang) {
    const th = Math.min(5, Math.floor(hl / 6)), td = Math.min(5, Math.floor(dl / 6));
    c.save(); c.lineCap = 'butt';
    const WX = -40;
    if (td >= 5) {
      c.strokeStyle = col.accent; c.lineWidth = 3;
      for (let k = 0; k < 4; k++) { c.globalAlpha = .18 - k * .04; c.beginPath(); c.moveTo(WX - 11 - k * 4, -122); c.lineTo(WX - 11 - k * 4, 122); c.stroke(); }
      c.globalAlpha = 1;
    }
    c.lineWidth = 9 + td * .8;
    if (td === 0) { c.strokeStyle = col.sand; c.setLineDash([9, 5]); }
    else if (td === 1) { c.strokeStyle = col.concrete; c.setLineDash([16, 6]); }
    else if (td === 2) { c.strokeStyle = col.concrete; }
    else if (td === 3) { c.strokeStyle = col.steel; c.setLineDash([26, 4]); }
    else { c.strokeStyle = col.steel; }
    c.beginPath(); c.moveTo(WX, -120); c.lineTo(WX, 120); c.stroke(); c.setLineDash([]);
    if (td >= 3) { c.lineWidth = 1.5; c.strokeStyle = col.steel; c.globalAlpha = .55; c.beginPath(); c.moveTo(WX + 10, -116); c.lineTo(WX + 10, 116); c.stroke(); c.globalAlpha = 1; }
    if (td >= 4) {
      c.fillStyle = col.steel;
      for (let y = -108; y <= 108; y += 24) { c.beginPath(); c.moveTo(WX - 6, y - 4); c.lineTo(WX - 15, y); c.lineTo(WX - 6, y + 4); c.closePath(); c.fill(); }
    }

    const ch = 16;
    c.beginPath();
    if (th < 3) c.rect(-34, -100, 82, 200);
    else { c.moveTo(-34 + ch, -100); c.lineTo(48, -100); c.lineTo(48, 100); c.lineTo(-34 + ch, 100); c.lineTo(-34, 100 - ch); c.lineTo(-34, -100 + ch); c.closePath(); }
    c.fillStyle = th >= 3 ? col.steelDark : col.bunker; c.fill();
    if (th >= 5) { c.strokeStyle = col.accent; c.globalAlpha = .2; c.lineWidth = 7; c.stroke(); c.globalAlpha = 1; }
    c.lineWidth = th >= 5 ? 3 : 2; c.strokeStyle = low ? col.danger : (th >= 5 ? col.gold : col.accent); c.stroke();
    if (th >= 1) {
      c.fillStyle = th >= 3 ? col.steel : col.concrete;
      const posts = th >= 3 ? [[-14, -95], [-14, 95], [43, -95], [43, 95]] : [[-29, -95], [-29, 95], [43, -95], [43, 95]];
      for (const p of posts) c.fillRect(p[0] - 5, p[1] - 5, 10, 10);
    }
    if (th >= 2) {
      c.fillStyle = col.fg; c.globalAlpha = .55;
      for (let y = -80; y <= 80; y += 20) { c.fillRect(-26, y - 1, 2, 2); c.fillRect(40, y - 1, 2, 2); }
      c.globalAlpha = 1;
    }

    for (let i = 0; i < 4; i++) {
      const y = SY[i];
      c.fillStyle = col.ground; c.fillRect(SX - 16, y - 19, 32, 38);
      c.lineWidth = 1; c.strokeStyle = col.line; c.strokeRect(SX - 16, y - 19, 32, 38);
      const u = units && units[i];
      if (u) {
        c.save(); c.translate(SX, y - 2); c.rotate(u.ang); c.fillStyle = col.fg; c.fillRect(0, -2, 16, 4); c.restore();
        const n = u.e.length;
        for (let k = 0; k < n; k++) {
          c.fillStyle = EC[u.e[k]]; c.beginPath(); c.moveTo(SX, y - 2);
          c.arc(SX, y - 2, 9, -Math.PI / 2 + k * 2 * Math.PI / n, -Math.PI / 2 + (k + 1) * 2 * Math.PI / n);
          c.closePath(); c.fill();
        }
        c.strokeStyle = col.ground; c.lineWidth = 2; c.beginPath(); c.arc(SX, y - 2, 9, 0, 6.283); c.stroke();
        c.fillStyle = col.fg; c.font = '700 9px "Noto Sans KR", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
        c.fillText(u.nm, SX, y + 16);
      }
    }

    c.save(); c.translate(TX, 0); c.rotate(ang);
    if (th >= 4) { c.fillStyle = col.steel; c.fillRect(2, -10, 20, 4); c.fillRect(2, 6, 20, 4); }
    c.fillStyle = col.fg; c.fillRect(0, -3.5, 32, 7);
    c.restore();
    c.fillStyle = th >= 5 ? col.gold : col.accent; c.beginPath(); c.arc(TX, 0, 10, 0, 6.283); c.fill();
    c.restore();
  }

  /* ---------- draw ---------- */
  function draw() {
    ctx.save();
    if (S.shake > 0 && !RM) ctx.translate((Math.random() - .5) * S.shake * 8, (Math.random() - .5) * S.shake * 8);
    ctx.fillStyle = col.ground; ctx.fillRect(-12, -12, W + 24, H + 24);
    ctx.strokeStyle = col.line; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 30) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += 30) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke(); ctx.globalAlpha = 1;

    ctx.save(); ctx.translate(BX, BY);
    drawBunker(ctx, save.hl, save.dl, S.hp < S.maxHp * .3, S.units, S.ang);
    ctx.restore();

    for (const p of S.par) { ctx.globalAlpha = Math.max(0, p.l * 2.5); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;

    for (const e of S.en) {
      const T = TYPES[e.k];
      ctx.fillStyle = e.fl > 0 ? col.fg : T.c;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
      if (e.k === 'tank') { ctx.strokeStyle = col.ground; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.r - 5, 0, 6.283); ctx.stroke(); }
      if (e.bt > 0) { ctx.fillStyle = col.fire; ctx.beginPath(); ctx.arc(e.x, e.y - e.r - 2, 2.5, 0, 6.283); ctx.fill(); }
      if (e.st > 0) { ctx.strokeStyle = col.water; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2, 0, 6.283); ctx.stroke(); }
      if (e.hp < e.mh) {
        ctx.fillStyle = col.line; ctx.fillRect(e.x - e.r, e.y - e.r - 6, e.r * 2, 3);
        ctx.fillStyle = col.ok; ctx.fillRect(e.x - e.r, e.y - e.r - 6, e.r * 2 * Math.max(0, e.hp / e.mh), 3);
      }
    }

    ctx.strokeStyle = col.bolt; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const f of S.fx) {
      ctx.globalAlpha = Math.min(1, f.l * 8);
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1);
      ctx.lineTo((f.x1 + f.x2) / 2 + (Math.random() - .5) * 8, (f.y1 + f.y2) / 2 + (Math.random() - .5) * 8);
      ctx.lineTo(f.x2, f.y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 3;
    for (const b of S.bul) {
      if (b.splash) { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 6.283); ctx.fill(); continue; }
      const m = Math.hypot(b.vx, b.vy);
      ctx.strokeStyle = b.c;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / m * 9, b.y - b.vy / m * 9); ctx.stroke();
    }

    if (S.flash > 0 && !RM) { ctx.fillStyle = col.danger; ctx.globalAlpha = S.flash * .3; ctx.fillRect(-12, -12, W + 24, H + 24); ctx.globalAlpha = 1; }
    ctx.restore();
  }

  /* ---------- hud ---------- */
  const el = id => document.getElementById(id);
  const hStage = el('hStage'), hWave = el('hWave'), hTime = el('hTime'), hpBar = el('hpBar'), hpTxt = el('hpTxt'), hScrap = el('hScrap'), hScore = el('hScore');
  function hud() {
    hStage.textContent = cur + ' ' + NAMES[cur - 1];
    hWave.textContent = Math.max(1, S.wave) + '/' + WAVES;
    hTime.textContent = (mode === 'play' && S.dur) ? Math.max(0, Math.ceil(S.dur - S.wt)) : 0;
    const p = Math.max(0, S.hp / S.maxHp);
    hpBar.style.width = (p * 100) + '%';
    hpBar.style.background = p < .3 ? col.danger : p < .6 ? col.accent : col.ok;
    hpTxt.textContent = Math.ceil(S.hp);
    hScrap.textContent = S.scrap;
    hScore.textContent = S.score;
  }

  /* ---------- screens ---------- */
  const UPS = [
    { name: '벙커 수리', desc: () => '체력 +40', cost: () => 30, ok: () => S.hp < S.maxHp, buy() { S.hp = Math.min(S.maxHp, S.hp + 40); } },
    { name: '연사 속도', desc: () => '포탑과 유닛 발사 간격 12% 단축 · Lv ' + S.lvF + '/8', cost: () => 40 + 25 * S.lvF, ok: () => S.lvF < 8, buy() { S.lvF++; S.delay *= .88; } },
    { name: '화력 강화', desc: () => '포탑과 유닛 공격력 25% 증가 · Lv ' + S.lvD + '/8', cost: () => 40 + 30 * S.lvD, ok: () => S.lvD < 8, buy() { S.lvD++; S.dmg *= 1.25; } },
    { name: '벙커 증축', desc: () => '최대 체력 +25, 체력 +25 · Lv ' + S.lvA + '/6', cost: () => 60 + 20 * S.lvA, ok: () => S.lvA < 6, buy() { S.lvA++; S.maxHp += 25; S.hp += 25; } }
  ];
  const menuRow = '<div class="row"><button data-act="select">단계 선택</button><button data-act="garage">벙커 강화</button><button data-act="units">유닛 편성</button><button data-act="gacha">유닛 뽑기</button></div>';
  function showStart() {
    mode = 'start';
    const i = cur - 1;
    ov.hidden = false;
    ov.innerHTML = '<div class="card"><h2>벙커 지키기</h2>' +
      '<p>왼쪽에서 오는 적을 오른쪽 벙커에서 막으세요. 포탑과 유닛이 알아서 공격합니다. 웨이브는 20~30초 이어지고, ' + WAVES + '개를 버티면 한 판이 끝납니다.</p>' +
      (save.coll.length ? '' : '<p><b>유닛 뽑기</b>에서 첫 유닛을 만나보세요. ' + PULL1 + '골드부터 시작합니다.</p>') +
      '<div class="stats"><div><span class="lab">현재 단계</span><b>' + cur + ' ' + NAMES[i] + '</b></div><div><span class="lab">플레이</span><b>' + Math.min(NEED, save.plays[i]) + '/' + NEED + '</b></div><div><span class="lab">골드</span><b>' + save.gold + '</b></div></div>' +
      '<button class="go" data-act="start">시작</button>' + menuRow + '</div>';
  }
  function showSelect() {
    mode = 'select';
    ov.hidden = false;
    let h = '<div class="card sel"><h2>단계 선택</h2><p>각 단계를 ' + NEED + '번 플레이하면 다음 단계가 열립니다.</p><div class="list">';
    for (let n = 1; n <= 30; n++) {
      const lock = n > save.unlocked, p = Math.min(NEED, save.plays[n - 1]);
      h += '<button data-act="pick" data-n="' + n + '"' + (lock ? ' disabled' : '') + (n === cur ? ' class="on"' : '') + '><span>' + n + ' · ' + NAMES[n - 1] + '</span><span class="cost">' + (lock ? '잠김' : p + '/' + NEED) + '</span></button>';
    }

    const on = ov.querySelector('.on'), l = ov.querySelector('.list');
    if (on && l) l.scrollTop = Math.max(0, on.offsetTop - l.clientHeight / 2);
  }
  function waveClear() {
    mode = 'upgrade';
    renderUp();
  }
  function renderUp() {
    ov.hidden = false;
    let h = '<div class="card"><h2>웨이브 ' + S.wave + ' 방어 성공</h2>' +
      '<div class="stats"><div><span class="lab">고철</span><b>' + S.scrap + '</b></div><div><span class="lab">체력</span><b>' + Math.ceil(S.hp) + '/' + S.maxHp + '</b></div></div><div class="ups">';
    UPS.forEach((u, i) => {
      const c = u.cost(), off = !u.ok() || S.scrap < c;
      h += '<button data-act="buy" data-i="' + i + '"' + (off ? ' disabled' : '') + '><span>' + u.name + '<small>' + u.desc() + '</small></span><span class="cost">' + (u.ok() ? c : '최대') + '</span></button>';
    });
    h += '</div><button class="go" data-act="next">웨이브 ' + (S.wave + 1) + ' 시작</button></div>';
    ov.innerHTML = h;
    hud();
  }
  function finish(win) {
    mode = 'over';

    if (key === lastSent) return;
    syncing = true;
    let ok = false;
    try { await jmApi.setRank(uid, Object.assign({}, p, { t: Date.now(), dn: String((me && me.name) || '').slice(0, 20) })); lastSent = key; ok = true; }
    catch (e) {
      if (e && e.code === 'permission-denied') { canWrite = false; renderRank(); }
      else syncT = setTimeout(doSync, 15000);
    }
    syncing = false;
    if (ok && stable(payload()) !== lastSent) scheduleSync();
  }
  async function saveCloud() {
    if (!jmApi || !uid) return;
    const j = JSON.stringify(save);
    if (j === lastCloud) return;
    lastCloud = j;
    try { await jmApi.setSave(uid, { json: j, t: Date.now() }); } catch (e) { lastCloud = ''; }
  }
  function updatePresence(force) {
    if (!jmApi || !myDoc) return;
    const p = { n: nick, s: cur, p: mode === 'play' ? 1 : 0 };
    const k = JSON.stringify(p);
    if (k === lastPres && !force) return;
    lastPres = k;
    jmApi.setPresence(uid, Object.assign({}, p, { t: Date.now() })).catch(() => {});
  }
  async function resolveNames() {}
  function nameOf(id, nk) {
    const n = (typeof nk === 'string' ? nk : '').trim().slice(0, 12);
    if (n) return n;
    const p = id && profs[id];
    return (p && p.name) || '친구';
  }
  function renderRank() {
    if (tab !== 'rank') return;
    let st;
    if (rankState === 'none') st = '친구 랭킹은 로그인한 상태에서만 보여요. 게임은 그대로 즐길 수 있어요.';
    else if (rankState === 'loading') st = '랭킹을 불러오는 중이에요.';
    else if (rankState === 'slow') st = '랭킹에 아직 닿지 않았어요. 연결되면 자동으로 채워집니다.';
    else if (canWrite === false) st = '내 기록을 올리지 못하고 있어요. 잠시 후 다시 시도해 주세요.';
    else st = (rankDocs.length ? '기록이 있는 친구 ' + rankDocs.length + '명' : '아직 기록이 없어요.') + (nick ? '' : ' 닉네임을 정하면 그 이름으로 보여요.');
    rkStatus.textContent = st;

    const online = {};
    for (const p of peersNow) if (p.kind === 'viewer') online[p.by || p.peer] = p.presence || {};
    const unitList = a => (Array.isArray(a) ? a : []).slice(0, 4).map(x => {
      if (!Array.isArray(x)) return null;
      const n = num(x[0], 7), es = String(x[1] || '').split('').map(c => num(c, 4)).slice(0, 4);
      return { n, es, s: num(x[2], 30) };
    }).filter(Boolean);
    const mapRow = (id, d) => ({ id, nick: d.nick, stage: Math.max(1, num(d.stage, 30)), front: num(d.front, 30), plays: num(d.plays, 99999), hl: num(d.hl, 30), dl: num(d.dl, 30), bl: num(d.bl, 60), gold: num(d.gold, 1e12), smax: num(d.smax, 30), coll: num(d.coll, 999), eq: unitList(d.eq), top: unitList(d.top) });
    const rows = rankDocs.filter(r => r.id !== uid).map(r => mapRow(r.id, r.d));
    const mine = mapRow(uid || '__me', payload());
    mine.nick = nick; mine.me = true;
    if (mine.plays > 0 || mine.nick || rows.length === 0) rows.push(mine);
    const keyOf = { stage: r => r.stage * 100 + r.front, bl: r => r.bl * 100 + r.stage, smax: r => r.smax * 1000 + r.coll, plays: r => r.plays }[sub];
    rows.sort((a, b) => keyOf(b) - keyOf(a) || b.plays - a.plays);
    rkList.textContent = '';
    const unitChip = u => {
      const c = mkEl('span', 'uc');
      u.es.forEach(i => c.appendChild(mkEl('i', 'dot e' + i)));
      c.appendChild(document.createTextNode(NMS[u.n] + (u.s ? ' ★' + u.s : '')));
      return c;
    };
    rows.slice(0, 50).forEach((r, i) => {
      const on = r.me ? true : !!online[r.id];
      const li = mkEl('li', 'pc' + (r.me ? ' me' : ''));
      const top = mkEl('div', 'pc-top');
      top.appendChild(mkEl('span', 'pos', String(i + 1)));
      top.appendChild(mkEl('span', 'nm', (r.me ? '나 · ' : '') + (r.me && !r.nick ? '닉네임 없음' : nameOf(r.id, r.nick))));
      const pr = online[r.id] || {};
      top.appendChild(mkEl('span', 'st ' + (on ? 'on' : 'off'), on ? (r.me ? (mode === 'play' && tab === 'game' ? '플레이 중' : '접속 중') : (pr.p ? '플레이 중' : '접속 중')) : '오프라인'));
      li.appendChild(top);
      const g = mkEl('div', 'pc-grid');
      [['진도', r.stage + '단계 ' + NAMES[r.stage - 1] + ' (' + r.front + '/30)'], ['벙커 체력', 'Lv ' + r.hl], ['벙커 방어력', 'Lv ' + r.dl], ['최고 유닛', '★' + r.smax], ['보유 유닛', r.coll + '종'], ['플레이', r.plays + '판']].forEach(kv => {
        const c = mkEl('div', 'kv'); c.appendChild(mkEl('span', 'k', kv[0])); c.appendChild(mkEl('b', 'v', kv[1])); g.appendChild(c);
      });
      li.appendChild(g);
      const eqs = mkEl('div', 'pc-units');
      eqs.appendChild(mkEl('span', 'k', '출전 유닛'));
      if (r.eq.length) r.eq.forEach(u => eqs.appendChild(unitChip(u)));
      else eqs.appendChild(mkEl('span', 'k', '없음'));
      li.appendChild(eqs);
      if (r.top.length) {
        const tp = mkEl('div', 'pc-units');
        tp.appendChild(mkEl('span', 'k', '강한 유닛'));
        r.top.forEach(u => tp.appendChild(unitChip(u)));
        li.appendChild(tp);
      }
      rkList.appendChild(li);
    });
    for (const b of rkSubs.children) b.classList.toggle('on', b.dataset.sub === sub);
  }
  const lMsg = el('lMsg'), lBtn = el('lBtn'), lErr = el('lErr'), loginEl = el('login'), tOut = el('tOut');
  function showLogin(kind) {
    loginEl.hidden = false;
    lBtn.hidden = kind !== 'in';
    lMsg.textContent = kind === 'setup' ? 'Firebase 설정이 아직 안 되어 있어요. README의 순서대로 firebaseConfig 값을 넣어 주세요.'
      : kind === 'in' ? '친구들과 같이 하려면 구글 계정으로 로그인해 주세요.' : '접속 확인 중…';
  }
  async function initFriends() {
    showLogin('wait');
    const jm = await window.jmReady;
    if (!jm || !jm.configured) { showLogin('setup'); return; }
    jmApi = jm;
    lBtn.addEventListener('click', async () => {
      lErr.hidden = true; lBtn.disabled = true;
      try { await jm.signIn(); } catch (e) { lErr.textContent = '로그인하지 못했어요. 팝업이 막혀 있지 않은지 확인해 주세요.'; lErr.hidden = false; }
      lBtn.disabled = false;
    });
    tOut.addEventListener('click', async () => { try { await jm.signOut(); } catch (e) {} location.reload(); });
    jm.onAuth(async u => {
      if (!u) { uid = null; me = null; myDoc = null; tOut.hidden = true; showLogin('in'); return; }
      if (uid === u.id) return;
      uid = u.id; me = u;
      /* a progress save kept in the account wins when this browser has fewer plays */
      try {
        const c = await jm.getSave(uid);
        if (c && c.json) {
          const r = JSON.parse(c.json), sum = a => (Array.isArray(a) ? a : []).reduce((x, y) => x + (+y || 0), 0);
          let adopted = false; try { adopted = sessionStorage.getItem('jm-adopt') === uid; } catch (e) {}
          if (sum(r.plays) > sum(save.plays) && !adopted) {
            try { localStorage.setItem(KEY, c.json); sessionStorage.setItem('jm-adopt', uid); } catch (e) {}
            location.reload(); return;
          }
        }
      } catch (e) {}
      loginEl.hidden = true; tOut.hidden = false;
      if (!nick) { nick = cleanNick(u.name); try { localStorage.setItem(NICK_KEY, nick); } catch (e) {} nickIn.value = nick; }
      myDoc = true; canWrite = true;
      const timer = setTimeout(() => { if (rankState === 'loading') { rankState = 'slow'; renderRank(); } }, 10000);
      jm.subRank(docs => {
        clearTimeout(timer);
        rankDocs = docs.filter(r => r.d && typeof r.d === 'object');
        for (const r of rankDocs) profs[r.id] = { name: String(r.d.dn || '') };
        rankState = 'ready';
        const mine = rankDocs.find(r => r.id === uid);
        if (mine && !lastSent) lastSent = stable(mine.d);
        renderRank(); scheduleSync();
      }, () => { clearTimeout(timer); rankState = 'none'; renderRank(); });
      let presRaw = [];
      const applyPres = () => {
        const now = Date.now();
        peersNow = presRaw.filter(x => now - (+x.d.t || 0) < 75000).map(x => ({ kind: 'viewer', by: x.id, peer: x.id, isMe: x.id === uid, presence: { n: x.d.n, s: x.d.s, p: x.d.p } }));
        renderRank();
      };
      jm.subPresence(list => { presRaw = list; applyPres(); }, () => {});
      setInterval(applyPres, 20000);
      setInterval(() => updatePresence(true), 30000);
      updatePresence(true); scheduleSync(); renderRank();
    });
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    presT += dt;
    if (presT > 1) { presT = 0; updatePresence(); }
    if (mode === 'play' && !paused) update(dt);
    draw(); hud();
    requestAnimationFrame(frame);
  }
  reset(); fit(); showStart(); initTabs(); initFriends();
  requestAnimationFrame(frame);
})();
</script>
<script type="module">
/* ===== 여기에 Firebase 웹 앱 설정값을 붙여 넣으세요 (README 3번) ===== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
/* ================================================================== */
const V = "10.14.1", B = "https://www.gstatic.com/firebasejs/" + V + "/";
try {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("YOUR_")) throw new Error("not configured");
  const [{ initializeApp }, A, F] = await Promise.all([
    import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")
  ]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  const col = n => F.collection(db, n), dref = (n, id) => F.doc(db, n, id);
  window.__jmResolve({
    configured: true,
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { id: u.uid, name: u.displayName || "", photo: u.photoURL || "" } : null)),
    signIn: async () => {
      const prov = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, prov); }
      catch (e) {
        if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) await A.signInWithRedirect(auth, prov);
        else throw e;
      }
    },
    signOut: () => A.signOut(auth),
    subRank: (ok, err) => F.onSnapshot(col("rank"), s => ok(s.docs.map(d => ({ id: d.id, d: d.data() }))), err),
    setRank: (id, d) => F.setDoc(dref("rank", id), d),
    subPresence: (ok, err) => F.onSnapshot(col("presence"), s => ok(s.docs.map(d => ({ id: d.id, d: d.data() }))), err),
    setPresence: (id, d) => F.setDoc(dref("presence", id), d),
    getSave: async id => { const s = await F.getDoc(dref("saves", id)); return s.exists() ? s.data() : null; },
    setSave: (id, d) => F.setDoc(dref("saves", id), d)
  });
} catch (e) {
  window.__jmResolve(e && e.message === "not configured" ? { configured: false } : null);
}
</script>
